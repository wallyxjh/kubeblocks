image:
  registry: docker.io
  repository: polardb/polardb_pg_local_instance
  # The official PolarDB-PG 17 image was verified on the KB 0.9 test cluster.
  tag: "17"
  # Linux/amd64 manifest for polardb/polardb_pg_local_instance:17.
  digest: sha256:5e455bbb9a13e05d4c62ac1def1db776758b0180c4c2191c8a7f79c4f27884a4
  pullPolicy: IfNotPresent
  pullSecrets: []

componentDefinition:
  # ComponentDefinitions are immutable in KubeBlocks 0.9. Change this name for
  # any incompatible engine or runtime change.
  name: polardb-pg-local-v2

dataMountPath: /var/polardb

# This chart deliberately manages one localfs PolarDB-PG engine Pod. It does
# not implement PolarDB shared-storage HA and must not be used as production HA.
localInstance:
  port: 5432
  # KubeBlocks 0.9 ComponentVersion accepts three-part SemVer only.
  serviceVersion: 17.11.1
  # The official engine banner is PostgreSQL 17.11 (PolarDB 17.11.1.0 ...).
  engineVersion: 17.11.1.0
