{{- if .Values.prometheusRule.enabled }}
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: polardb-postgresql-ha-rules
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "postgresql.labels" . | nindent 4 }}
spec:
  groups:
  - name: polardb-postgresql-ha
    rules:
    - alert: PolarDBPostgreSQLNoPrimary
      expr: |
        sum by (namespace, app_kubernetes_io_instance) (
          pg_replication_is_master{app_kubernetes_io_name="polardb-postgresql-ha"}
        ) != 1
      for: 1m
      labels:
        severity: critical
      annotations:
        summary: PolarDB PostgreSQL cluster does not have exactly one primary
        description: PolarDB PostgreSQL cluster {{ "{{ $labels.app_kubernetes_io_instance }}" }} has {{ "{{ $value }}" }} primaries.
    - alert: PolarDBPostgreSQLReplicationLag
      expr: |
        max by (namespace, app_kubernetes_io_instance, pod) (
          max_over_time(pg_replication_lag{app_kubernetes_io_name="polardb-postgresql-ha"}[2m])
        ) > {{ .Values.prometheusRule.replicationLagSeconds }}
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: PolarDB PostgreSQL replication lag is high
        description: Pod {{ "{{ $labels.pod }}" }} replication lag is {{ "{{ $value | printf \"%.2f\" }}" }} seconds.
    - alert: PolarDBPostgreSQLBackupPolicyUnavailable
      expr: |
        kube_customresource_status_phase{
          customresource_kind="BackupPolicy",
          phase!="Available",
          name=~".*-postgresql-backup-policy"
        } == 1
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: PolarDB PostgreSQL backup policy is not available
        description: BackupPolicy {{ "{{ $labels.name }}" }} is not Available.
{{- end }}
